<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>USD to Yen</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1917;
      --muted: #57534e;
      --line: #e7e5e4;
      --paper: #fafaf9;
      --card: #ffffff;
      --accent: #452347;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
      color: var(--ink);
      background: var(--paper);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 420px);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px 24px 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.45;
      font-size: 0.95rem;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      letter-spacing: 0.02em;
    }

    input {
      width: 100%;
      margin-bottom: 16px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
      font-size: 1.15rem;
      color: var(--ink);
      background: #fff;
    }

    input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: transparent;
    }

    output {
      display: block;
      margin-top: 4px;
      padding: 16px;
      border-radius: 12px;
      background: #fff1f2;
      color: var(--accent);
      font-size: 1.6rem;
      font-weight: 600;
    }

    .note {
      margin: 14px 0 0;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>USD to yen</h1>
    <p>Type a dollar amount. The result updates as you go.</p>

    <form id="converter">
      <label for="usd">US dollars</label>
      <input id="usd" name="usd" type="number" inputmode="decimal" min="0" step="0.01" value="100" required>

      <label for="rate">Yen per US dollar</label>
      <input id="rate" name="rate" type="number" inputmode="decimal" min="0" step="0.01" value="158.54" required>

      <output id="yen" for="usd rate">¥15,854</output>
      <p class="note" id="detail">100 US dollars is about 15,854 yen at 158.54 yen per dollar.</p>
    </form>
  </main>

  <script>
    const usdInput = document.querySelector("#usd");
    const rateInput = document.querySelector("#rate");
    const yenOutput = document.querySelector("#yen");
    const detail = document.querySelector("#detail");
    const yenFormat = new Intl.NumberFormat("en-US", {
      style: "currency",
      currency: "JPY",
      maximumFractionDigits: 0
    });
    const numberFormat = new Intl.NumberFormat("en-US", {
      maximumFractionDigits: 2
    });

    function convert() {
      const dollars = Number(usdInput.value);
      const rate = Number(rateInput.value);
      const valid = Number.isFinite(dollars) && Number.isFinite(rate) && dollars >= 0 && rate > 0;

      if (!valid) {
        yenOutput.textContent = "—";
        detail.textContent = "Enter a dollar amount and a rate above zero.";
        return;
      }

      const yen = dollars * rate;
      yenOutput.textContent = yenFormat.format(yen);
      detail.textContent = `${numberFormat.format(dollars)} US dollars is about ${numberFormat.format(Math.round(yen))} yen at ${numberFormat.format(rate)} yen per dollar.`;
    }

    usdInput.addEventListener("input", convert);
    rateInput.addEventListener("input", convert);
    convert();
  </script>
</body>
</html>
